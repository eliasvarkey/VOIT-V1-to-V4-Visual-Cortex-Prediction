subject: "S1"
seed: 17

v1_topk: 4000
v4_topk: 2000

mapping:
  batch_size: 128
  mlp_hidden1: 2048
  mlp_hidden2: 1024
  dropout: 0.2
  lr: 2.0e-4
  weight_decay: 1.0e-4
  epochs: 100
  patience: 12
  kfolds: 5
  use_gru_branch: true
  gru_hidden: 512
  seq_window: 5
  fusion_lr: 1.0e-3
  fusion_epochs: 30

sd:
  model_id: "stable-diffusion-v1-5/stable-diffusion-v1-5"
  image_size: 512
  latent_pca_dim: 1024
  caption_model: "nlpconnect/vit-gpt2-image-captioning"
  guidance_scale: 8.0
  ddim_steps: 50
  img2img_strength: 0.35

paths:
  data_root: "data/vim1"
  out_root: "outputs"
